# Publishes the package to npm when a v* tag is pushed.
#
# Authentication is by npm Trusted Publishing: npm accepts a short lived OIDC
# token minted by GitHub for this exact workflow, so there is no long lived
# publish token to store, rotate or leak.
#
# The trusted publisher registered on npm names this file by path, so renaming
# or moving it breaks publishing until the npm side is updated to match.
#
# Release, each time:
#   npm version patch   # bumps package.json and creates the matching v* tag
#   git push --follow-tags
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # Required twice over: it is how the runner mints the OIDC token that npm
  # trades for publish rights, and how the published package gets its provenance
  # attestation tying it to this commit and workflow.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 still bundles
      # npm 10.9.x, which has no OIDC support and fails with an authentication
      # error that reads like a misconfigured publisher rather than an old CLI.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # The tag is the single source of truth for a release, but package.json is
      # what npm actually publishes. Disagreement between them means a mistagged
      # release, so stop before it reaches the registry.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Verify the built CLI is actually runnable from the tarball layout before
      # it goes out, rather than finding out from the first `npx` user.
      - name: Smoke test the CLI
        run: node ./dist/cli.js --version

      # No token: npm exchanges the workflow's OIDC identity for publish rights.
      - name: Publish to npm
        run: npm publish --provenance --access public
