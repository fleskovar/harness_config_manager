# Publishes the package to npm when a v* tag is pushed.
#
# Setup, once:
#   1. Create an npm automation token: npmjs.com -> Access Tokens -> Generate ->
#      Granular Access (or Classic "Automation"). Automation tokens bypass 2FA,
#      which a workflow cannot answer.
#   2. Add it to the repo as the secret NPM_TOKEN:
#      Settings -> Secrets and variables -> Actions -> New repository secret.
#
# Release, each time:
#   npm version patch   # bumps package.json and creates the matching v* tag
#   git push --follow-tags
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance: the workflow signs the package with a short
  # lived OIDC token so npm can attest which commit and workflow built it.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The tag is the single source of truth for a release, but package.json is
      # what npm actually publishes. Disagreement between them means a mistagged
      # release, so stop before it reaches the registry.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Verify the built CLI is actually runnable from the tarball layout before
      # it goes out, rather than finding out from the first `npx` user.
      - name: Smoke test the CLI
        run: node ./dist/cli.js --version

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
